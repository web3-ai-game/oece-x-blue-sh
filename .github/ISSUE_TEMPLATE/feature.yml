name: Feature
description: A hardening check, module, or doc change.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: Proposal
      description: What should change, and which menu it belongs to.
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Constraints
      options:
        - label: This does not add telemetry, sample upload, or a proxy feature.
          required: true
        - label: SSH or firewall changes still go through preflight and rollback.
          required: false
